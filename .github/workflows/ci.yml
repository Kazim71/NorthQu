name: CI

# Runs on every push and every pull request targeting main. This is a
# compile-and-build gate only — typecheck + build for each of the three
# independently-deployable folders (backend, frontend, tracking-snippet).
# It deliberately does NOT run the verify-*.mjs scripts in test/: those hit
# a live Supabase project and real data, which isn't safe or meaningful to
# run from an untrusted CI runner against the shared production database.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholder values for a build-time-only check. Real Supabase
      # clients are constructed inside Server Components that call
      # next/headers' cookies() (see src/lib/supabase/server.ts), which
      # opts those routes out of static generation — so `next build` never
      # actually connects to Supabase with these. They exist only so
      # `process.env.X!` doesn't read as empty during the build step.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  event-types-sync:
    name: EVENT_TYPES sync (backend <-> tracking-snippet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain Node, no deps, no install — see the script's own header for
      # what it checks and why it lives in .github/ rather than scripts/
      # (the latter is gitignored repo-wide as internal-only tooling).
      - run: node .github/ci-checks/verify-event-types-sync.mjs

  tracking-snippet:
    name: Tracking snippet (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracking-snippet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tracking-snippet/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
